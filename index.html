<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLR Bites</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-gray-950 min-h-screen text-white">

    <!-- AUTH SCREEN — name only -->
    <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">🍽️</div>
                <h1 class="text-3xl font-bold">BLR Bites</h1>
                <p class="text-gray-400 mt-1 text-sm">Bangalore's personal food diary</p>
            </div>
            <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 space-y-3">
                <input id="entry-name" type="text" placeholder="Pick a username (e.g. gunjan)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                <button id="auth-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold p-3 rounded-xl transition-all transform hover:-translate-y-0.5 shadow-lg shadow-orange-500/20 text-sm">
                    Let's go →
                </button>
                <p id="auth-msg" class="text-red-400 text-sm text-center hidden"></p>
            </div>
        </div>
    </div>

    <!-- PROFILE NAME PROMPT (fallback for existing email users without a profile) -->
    <div id="profile-screen" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-sm">
            <div class="text-center mb-8">
                <div class="text-6xl mb-4">👋</div>
                <h1 class="text-2xl font-bold">What should we call you?</h1>
                <p class="text-gray-400 mt-1 text-sm">This shows on your reviews</p>
            </div>
            <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 space-y-3">
                <input id="display-name" type="text" placeholder="Your name (e.g. Gunjan)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                <button id="save-name-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold p-3 rounded-xl transition-all text-sm">
                    Let's go →
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-screen" class="hidden">

        <!-- STICKY HEADER -->
        <header class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800/60">
            <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <span class="text-xl">🍽️</span>
                    <span class="font-bold text-lg tracking-tight">BLR Bites</span>
                </div>
                <div class="flex items-center gap-2 sm:gap-3">
                    <div class="flex items-center gap-2">
                        <div id="user-avatar" class="w-8 h-8 rounded-full bg-gradient-to-br from-orange-500 to-red-500 flex items-center justify-center text-xs font-bold flex-shrink-0"></div>
                        <span id="user-name" class="text-sm text-gray-300 hidden sm:block"></span>
                    </div>
                    <button id="add-review-btn" class="flex items-center gap-1 bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-semibold px-3 py-2 rounded-xl text-sm transition-all transform hover:-translate-y-0.5 shadow-lg shadow-orange-500/20 whitespace-nowrap">
                        <span class="text-base leading-none font-bold">+</span>
                        <span class="hidden sm:inline">Add Review</span>
                    </button>
                    <button id="logout-btn" class="text-gray-600 hover:text-gray-400 text-xs transition-colors hidden sm:block">Logout</button>
                </div>
            </div>
        </header>

        <!-- FILTER BAR -->
        <div class="sticky top-[57px] z-30 bg-gray-950/80 backdrop-blur-md border-b border-gray-800/40">
            <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-2 overflow-x-auto scrollbar-hide">
                <button class="filter-chip active" data-filter="all">All</button>
                <button class="filter-chip" data-filter="Like">🔥 Loved</button>
                <button class="filter-chip" data-filter="One-Time Try">🤔 Once</button>
                <button class="filter-chip" data-filter="Dislike">🚫 Skip</button>
                <div class="h-5 w-px bg-gray-700 mx-1 flex-shrink-0"></div>
                <select id="cuisine-filter" class="filter-select">
                    <option value="">All Cuisines</option>
                </select>
                <div class="h-5 w-px bg-gray-700 mx-1 flex-shrink-0"></div>
                <input id="search-filter" type="text" placeholder="🔍 Search..." class="bg-gray-800/60 border border-gray-700/60 text-white text-xs rounded-full px-3 py-1.5 outline-none focus:border-orange-500 transition-colors w-28 flex-shrink-0 placeholder-gray-500">
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <main class="max-w-6xl mx-auto px-4 py-6">
            <div id="reviews-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            <div id="empty-state" class="hidden text-center py-20">
                <div class="text-6xl mb-4">🍜</div>
                <p class="text-gray-400 text-lg font-medium">No reviews yet</p>
                <p class="text-gray-600 text-sm mt-1">Be the first to add one!</p>
            </div>
        </main>
    </div>

    <!-- ADD REVIEW MODAL -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div id="modal-card" class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-md shadow-2xl">
            <div class="flex items-center justify-between p-5 border-b border-gray-800">
                <h2 class="text-lg font-bold">New Review</h2>
                <button id="modal-close" class="text-gray-500 hover:text-white transition-colors text-2xl leading-none w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-800">&times;</button>
            </div>
            <div class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">

                <!-- Restaurant Search -->
                <div class="relative">
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Restaurant</label>
                    <input id="restaurant-search" type="text" placeholder="Search in Bangalore..." autocomplete="off"
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                    <ul id="search-results" class="absolute bg-gray-800 border border-gray-700 w-full mt-1 rounded-xl shadow-2xl hidden z-20 max-h-48 overflow-y-auto divide-y divide-gray-700/50"></ul>
                </div>

                <!-- Dish -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">What did you order?</label>
                    <input id="dish-name" type="text" placeholder="e.g. Masala Dosa, IPA, Biryani..."
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                </div>

                <!-- Notes -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Notes <span class="text-gray-600 normal-case font-normal">(optional)</span></label>
                    <textarea id="notes" placeholder="e.g. Get the crispy dosa, avoid weekends..." rows="2"
                        class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm resize-none"></textarea>
                </div>

                <!-- Cuisine -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Cuisine <span class="text-gray-600 normal-case font-normal">(optional)</span></label>
                    <div class="flex flex-wrap gap-2" id="cuisine-pills"></div>
                </div>

                <!-- Rating -->
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Your Take</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="rating-btn" data-value="Like">
                            <span class="text-2xl">🔥</span>
                            <span class="text-xs font-medium mt-1 text-gray-300">Loved it</span>
                        </button>
                        <button class="rating-btn" data-value="One-Time Try">
                            <span class="text-2xl">🤔</span>
                            <span class="text-xs font-medium mt-1 text-gray-300">Once</span>
                        </button>
                        <button class="rating-btn" data-value="Dislike">
                            <span class="text-2xl">🚫</span>
                            <span class="text-xs font-medium mt-1 text-gray-300">Skip it</span>
                        </button>
                    </div>
                </div>

                <button id="submit-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold p-3 rounded-xl transition-all shadow-lg shadow-orange-500/20 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    Save Review
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
        <div id="toast-inner" class="flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium"></div>
    </div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
