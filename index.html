<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLR Food Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-6">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-10">
        <h1 class="text-2xl font-bold mb-2">📍 BLR Food Tracker</h1>
        
        <div id="auth-section" class="mb-6 pb-6 border-b">
            <h2 class="text-lg font-semibold mb-2">Log In to Add Reviews</h2>
            <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded">
            <input id="password" type="password" placeholder="Password" class="w-full mb-2 p-2 border rounded">
            <div class="flex gap-2">
                <button id="signup-btn" class="bg-gray-200 px-4 py-2 rounded font-semibold w-1/2">Sign Up</button>
                <button id="login-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold w-1/2">Log In</button>
            </div>
            <p id="auth-msg" class="text-sm text-red-500 mt-2 hidden"></p>
        </div>

        <div id="app-section" class="hidden mb-6 pb-6 border-b">
            <h2 class="text-lg font-semibold mb-2">Add a Spot</h2>
            <input id="restaurant-name" type="text" placeholder="Restaurant Name (e.g., Meghana Foods)" class="w-full mb-2 p-2 border rounded">
            <input id="dish-name" type="text" placeholder="What did you order?" class="w-full mb-2 p-2 border rounded">
            
            <select id="rating" class="w-full mb-4 p-2 border rounded">
                <option value="Like">🔥 Loved it (Like)</option>
                <option value="Dislike">🚫 Skip it (Dislike)</option>
                <option value="One-Time Try">🤔 One-Time Try</option>
            </select>
            
            <button id="submit-btn" class="bg-black text-white px-4 py-2 rounded font-bold w-full">Save Review</button>
            <p id="submit-msg" class="text-sm text-green-600 mt-2 hidden">Review saved!</p>
        </div>

        <div>
            <h2 class="text-lg font-semibold mb-4">Recent Reviews</h2>
            <div id="reviews-list" class="space-y-4">
                <p class="text-gray-500 text-sm">Loading reviews...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // 🛑 PASTE YOUR KEYS HERE 🛑
        const supabaseUrl = 'YOUR_PROJECT_URL_HERE'
        const supabaseKey = 'YOUR_PUBLISHABLE_KEY_HERE'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let currentUser = null;

        // UI Elements
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const authMsg = document.getElementById('auth-msg');
        const reviewsList = document.getElementById('reviews-list');

        // 1. Check if user is already logged in
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
            }
            fetchReviews();
        }

        // 2. Auth Buttons
        document.getElementById('signup-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) { authMsg.textContent = error.message; authMsg.classList.remove('hidden'); } 
            else { checkUser(); }
        });

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { authMsg.textContent = error.message; authMsg.classList.remove('hidden'); } 
            else { checkUser(); }
        });

        // 3. Submit Review
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const restaurantName = document.getElementById('restaurant-name').value;
            const dishName = document.getElementById('dish-name').value;
            const rating = document.getElementById('rating').value;

            if(!restaurantName || !dishName) return alert("Fill in all fields!");

            // First, save the restaurant
            const { data: restData, error: restError } = await supabase
                .from('restaurants')
                .insert([{ name: restaurantName }])
                .select();

            if (restError) return alert(restError.message);

            // Then, save the review linked to the restaurant
            const { error: reviewError } = await supabase
                .from('reviews')
                .insert([{ 
                    restaurant_id: restData[0].id, 
                    user_id: currentUser.id, 
                    dish_name: dishName, 
                    rating: rating 
                }]);

            if (reviewError) return alert(reviewError.message);

            // Clear form and refresh
            document.getElementById('restaurant-name').value = '';
            document.getElementById('dish-name').value = '';
            document.getElementById('submit-msg').classList.remove('hidden');
            setTimeout(() => document.getElementById('submit-msg').classList.add('hidden'), 3000);
            fetchReviews();
        });

        // 4. Fetch and Display Reviews
        async function fetchReviews() {
            const { data, error } = await supabase
                .from('reviews')
                .select(`
                    dish_name,
                    rating,
                    restaurants ( name )
                `)
                .order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            reviewsList.innerHTML = '';
            if (data.length === 0) reviewsList.innerHTML = '<p class="text-gray-500 text-sm">No reviews yet.</p>';

            data.forEach(review => {
                const icon = review.rating === 'Like' ? '🔥' : review.rating === 'Dislike' ? '🚫' : '🤔';
                reviewsList.innerHTML += `
                    <div class="bg-gray-100 p-3 rounded shadow-sm">
                        <p class="font-bold">${review.restaurants.name} ${icon}</p>
                        <p class="text-sm text-gray-700">Dish: ${review.dish_name}</p>
                    </div>
                `;
            });
        }

        checkUser();
    </script>
</body>
</html>
