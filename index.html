<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLOBAL.HQ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>GLOBAL.HQ</h1>
        <p>DRAG TO EXPLORE</p>
    </div>

    <div class="globe-container">
        <canvas id="cobe"></canvas>
    </div>

    <script type="module">
        import createGlobe from 'https://esm.sh/cobe@0.6.3';

        const canvas = document.getElementById("cobe");
        
        let phi = 0;
        let pointerInteracting = null;
        let pointerInteractionMovement = 0;
        
        // Handle resizing
        let width = 0;
        const onResize = () => {
            width = canvas.offsetWidth;
            // Scale up for high DPI displays (Retina screens)
            canvas.width = width * 2;
            canvas.height = width * 2;
        };
        window.addEventListener('resize', onResize);
        onResize();

        // Initialize the Globe
        const globe = createGlobe(canvas, {
            devicePixelRatio: 2,
            width: width * 2,
            height: width * 2,
            phi: 0,
            theta: 0.3,
            dark: 1, // Dark mode
            diffuse: 1.2,
            mapSamples: 16000,
            mapBrightness: 6,
            baseColor: [0.1, 0.1, 0.1], // Dark grey/black
            markerColor: [1, 1, 1],
            glowColor: [0.05, 0.05, 0.05],
            markers: [],
            onRender: (state) => {
                // Auto-rotate if not interacting
                if (pointerInteracting === null) {
                    phi += 0.005;
                }
                state.phi = phi + pointerInteractionMovement;
                state.width = width * 2;
                state.height = width * 2;
            }
        });

        // Mouse & Touch Interactions
        canvas.addEventListener('pointerdown', (e) => {
            pointerInteracting = e.clientX;
            canvas.style.cursor = 'grabbing';
        });

        canvas.addEventListener('pointerup', () => {
            pointerInteracting = null;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('pointerout', () => {
            pointerInteracting = null;
            canvas.style.cursor = 'grab';
        });

        canvas.addEventListener('mousemove', (e) => {
            if (pointerInteracting !== null) {
                const delta = e.clientX - pointerInteracting;
                pointerInteractionMovement = delta * 0.01; // Scale the drag speed
            }
        });
        
        // Touch support for mobile dragging
        canvas.addEventListener('touchmove', (e) => {
            if (pointerInteracting !== null && e.touches[0]) {
                const delta = e.touches[0].clientX - pointerInteracting;
                pointerInteractionMovement = delta * 0.01;
            }
        });
    </script>
</body>
</html>
