<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLR Food Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Make the search dropdown scrollbar look modern */
        #search-results::-webkit-scrollbar { width: 6px; }
        #search-results::-webkit-scrollbar-track { background: transparent; }
        #search-results::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-orange-50 to-rose-100 min-h-screen text-gray-800 p-4 md:p-8">

    <div class="max-w-md mx-auto bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl overflow-hidden border border-white/50 mt-4 md:mt-10">
        
        <div class="bg-gradient-to-r from-orange-500 to-red-500 p-6 text-white text-center shadow-inner">
            <h1 class="text-3xl font-bold tracking-tight">📍 BLR Bites</h1>
            <p class="text-orange-100 text-sm mt-1 opacity-90">Track your favorite Bangalore spots</p>
        </div>
        
        <div class="p-6 md:p-8">
            <div id="auth-section" class="mb-6 pb-6 border-b border-gray-200">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Welcome Back</h2>
                <div class="space-y-3">
                    <input id="email" type="email" placeholder="Email address" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all">
                    <input id="password" type="password" placeholder="Password" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all">
                    <button id="login-btn" class="w-full bg-gray-900 hover:bg-gray-800 text-white p-3 rounded-xl font-semibold shadow-md transform transition hover:-translate-y-0.5">Log In</button>
                </div>
                <p id="auth-msg" class="text-sm text-red-500 mt-3 hidden text-center font-medium"></p>
            </div>

            <div id="app-section" class="hidden mb-8 pb-8 border-b border-gray-200">
                <h2 class="text-xl font-semibold mb-4 text-gray-700">Add a New Spot</h2>
                
                <div class="space-y-4">
                    <div class="relative w-full">
                        <input id="restaurant-search" type="text" placeholder="Search for a restaurant..." class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all shadow-sm" autocomplete="off">
                        <ul id="search-results" class="absolute bg-white border border-gray-100 w-full mt-2 rounded-xl shadow-2xl hidden z-20 max-h-56 overflow-y-auto divide-y divide-gray-50"></ul>
                    </div>
                    
                    <input id="dish-name" type="text" placeholder="What did you order?" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 focus:border-transparent outline-none transition-all">
                    
                    <select id="rating" class="w-full p-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none appearance-none cursor-pointer">
                        <option value="Like">🔥 Loved it</option>
                        <option value="One-Time Try">🤔 One-Time Try</option>
                        <option value="Dislike">🚫 Skip it</option>
                    </select>
                    
                    <button id="submit-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white p-3 rounded-xl font-bold shadow-lg transform transition hover:-translate-y-0.5">Save Review</button>
                    
                    <div id="submit-msg" class="hidden bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-xl text-center text-sm font-medium mt-2">
                        🎉 Review saved successfully!
                    </div>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Recent Feed</h2>
                    <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium">Live</span>
                </div>
                <div id="reviews-list" class="space-y-4">
                    <div class="animate-pulse flex space-x-4">
                        <div class="flex-1 space-y-4 py-1">
                            <div class="h-4 bg-gray-200 rounded w-3/4"></div>
                            <div class="space-y-2">
                                <div class="h-3 bg-gray-200 rounded"></div>
                                <div class="h-3 bg-gray-200 rounded w-5/6"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://eyhcwmccjkvcpfbkbpea.supabase.co'
        const supabaseKey = 'sb_publishable_bBAzEQACxjmRwd7IqCLEvQ_eLzlOGAM'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let currentUser = null;
        let selectedPlace = null; 

        // UI Elements
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const authMsg = document.getElementById('auth-msg');
        const reviewsList = document.getElementById('reviews-list');
        const searchInput = document.getElementById('restaurant-search');
        const searchResults = document.getElementById('search-results');

        // --- OPENSTREETMAP SEARCH LOGIC ---
        let timeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const query = e.target.value;
            
            if(query.length < 3) {
                searchResults.classList.add('hidden');
                return;
            }
            
            timeout = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Bangalore')}&limit=5`);
                    const data = await res.json();
                    
                    searchResults.innerHTML = '';
                    if(data.length > 0) {
                        searchResults.classList.remove('hidden');
                        data.forEach(place => {
                            const li = document.createElement('li');
                            li.className = 'p-3 hover:bg-orange-50 cursor-pointer transition-colors';
                            
                            const shortName = place.name || place.display_name.split(',')[0];
                            li.innerHTML = `
                                <div class="font-semibold text-gray-800">${shortName}</div>
                                <div class="text-xs text-gray-500 truncate mt-0.5">${place.display_name}</div>
                            `;
                            
                            li.onclick = () => {
                                searchInput.value = shortName;
                                selectedPlace = {
                                    name: shortName,
                                    address: place.display_name,
                                    url: `http://maps.google.com/maps?q=${place.lat},${place.lon}`
                                };
                                searchResults.classList.add('hidden');
                            };
                            searchResults.appendChild(li);
                        });
                    } else {
                        searchResults.innerHTML = '<li class="p-4 text-sm text-gray-500 text-center italic">No places found. Try another name.</li>';
                        searchResults.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error("Search failed:", err);
                }
            }, 500); 
        });

        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== searchResults) {
                searchResults.classList.add('hidden');
            }
        });

        // --- AUTH SETUP ---
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
            }
            fetchReviews();
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Basic UI feedback during load
            const btn = document.getElementById('login-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Loading...';
            
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            
            btn.textContent = originalText;
            
            if (error) { authMsg.textContent = error.message; authMsg.classList.remove('hidden'); } 
            else { checkUser(); }
        });

        // --- SUBMIT REVIEW ---
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const dishName = document.getElementById('dish-name').value;
            const rating = document.getElementById('rating').value;

            if(!selectedPlace) return alert("Please select a restaurant from the dropdown list!");
            if(!dishName) return alert("What did you order?");

            const btn = document.getElementById('submit-btn');
            const originalText = btn.textContent;
            btn.textContent = 'Saving...';

            const { data: restData, error: restError } = await supabase
                .from('restaurants')
                .insert([{ 
                    name: selectedPlace.name,
                    address: selectedPlace.address,
                    google_maps_url: selectedPlace.url
                }])
                .select();

            if (restError) { btn.textContent = originalText; return alert(restError.message); }

            const { error: reviewError } = await supabase
                .from('reviews')
                .insert([{ 
                    restaurant_id: restData[0].id, 
                    user_id: currentUser.id, 
                    dish_name: dishName, 
                    rating: rating 
                }]);

            btn.textContent = originalText;
            if (reviewError) return alert(reviewError.message);

            searchInput.value = '';
            document.getElementById('dish-name').value = '';
            selectedPlace = null; 
            
            document.getElementById('submit-msg').classList.remove('hidden');
            setTimeout(() => document.getElementById('submit-msg').classList.add('hidden'), 3000);
            fetchReviews();
        });

// --- FETCH REVIEWS ---
        async function fetchReviews() {
            // We added 'id' and 'user_id' to the select statement!
            const { data, error } = await supabase
                .from('reviews')
                .select(`
                    id,
                    user_id,
                    dish_name,
                    rating,
                    restaurants ( name, address, google_maps_url )
                `)
                .order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            reviewsList.innerHTML = '';
            if (data.length === 0) {
                reviewsList.innerHTML = `
                    <div class="text-center p-6 bg-gray-50 rounded-xl border border-dashed border-gray-300">
                        <p class="text-gray-500 text-sm">No reviews yet. Be the first to add one!</p>
                    </div>`;
                return;
            }

            data.forEach(review => {
                let badgeClass = '';
                let icon = '';
                if(review.rating === 'Like') {
                    badgeClass = 'bg-green-100 text-green-700 border-green-200';
                    icon = '🔥 Loved it';
                } else if(review.rating === 'Dislike') {
                    badgeClass = 'bg-red-100 text-red-700 border-red-200';
                    icon = '🚫 Skip it';
                } else {
                    badgeClass = 'bg-yellow-100 text-yellow-700 border-yellow-200';
                    icon = '🤔 One-Time Try';
                }

                // Check if the current logged-in user owns this review
                const isOwner = currentUser && currentUser.id === review.user_id;
                // If they own it, show a delete button. If not, show nothing.
                const deleteBtnHtml = isOwner 
                    ? `<button onclick="deleteReview('${review.id}')" class="text-xs text-red-400 hover:text-red-600 transition-colors">🗑️ Delete</button>` 
                    : '';

                reviewsList.innerHTML += `
                    <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow relative overflow-hidden group">
                        <div class="absolute left-0 top-0 bottom-0 w-1 bg-gradient-to-b from-orange-400 to-red-400"></div>
                        
                        <div class="flex justify-between items-start mb-2 pl-2">
                            <a href="${review.restaurants.google_maps_url}" target="_blank" class="font-bold text-gray-800 text-lg hover:text-orange-600 transition-colors">
                                ${review.restaurants.name}
                            </a>
                            <div class="flex flex-col items-end gap-2">
                                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${badgeClass} whitespace-nowrap ml-2">
                                    ${icon}
                                </span>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        
                        <div class="pl-2">
                            <p class="text-xs text-gray-400 mb-3 truncate line-clamp-1" title="${review.restaurants.address}">
                                ${review.restaurants.address}
                            </p>
                            
                            <div class="bg-gray-50 rounded-lg p-3 inline-block w-full border border-gray-100">
                                <p class="text-sm text-gray-600">Order: <span class="font-medium text-gray-900">${review.dish_name}</span></p>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // --- NEW: DELETE REVIEW FUNCTION ---
        // We attach it to the window object so the HTML button can trigger it
        window.deleteReview = async function(reviewId) {
            if(!confirm("Are you sure you want to delete this review?")) return;
            
            const { error } = await supabase
                .from('reviews')
                .delete()
                .eq('id', reviewId);
                
            if (error) {
                alert("Error deleting: " + error.message);
            } else {
                fetchReviews(); // Refresh the feed instantly
            }
        };
        checkUser();
    </script>
</body>
</html>
