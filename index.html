<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLR Food Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-6">

    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 mt-10">
        <h1 class="text-2xl font-bold mb-2">📍 BLR Food Tracker</h1>
        
        <div id="auth-section" class="mb-6 pb-6 border-b">
            <h2 class="text-lg font-semibold mb-2">Log In to Add Reviews</h2>
            <input id="email" type="email" placeholder="Email" class="w-full mb-2 p-2 border rounded">
            <input id="password" type="password" placeholder="Password" class="w-full mb-2 p-2 border rounded">
            <div class="flex gap-2">
                <button id="login-btn" class="bg-blue-600 text-white px-4 py-2 rounded font-semibold w-full">Log In</button>
            </div>
            <p id="auth-msg" class="text-sm text-red-500 mt-2 hidden"></p>
        </div>

        <div id="app-section" class="hidden mb-6 pb-6 border-b">
            <h2 class="text-lg font-semibold mb-2">Add a Spot</h2>
            
            <div class="relative w-full mb-2">
                <input id="restaurant-search" type="text" placeholder="Search for a restaurant (e.g. Meghana)..." class="w-full p-2 border rounded border-blue-400 shadow-sm" autocomplete="off">
                <ul id="search-results" class="absolute bg-white border w-full mt-1 rounded shadow-lg hidden z-10 max-h-48 overflow-y-auto"></ul>
            </div>
            
            <input id="dish-name" type="text" placeholder="What did you order?" class="w-full mb-2 p-2 border rounded">
            
            <select id="rating" class="w-full mb-4 p-2 border rounded">
                <option value="Like">🔥 Loved it (Like)</option>
                <option value="Dislike">🚫 Skip it (Dislike)</option>
                <option value="One-Time Try">🤔 One-Time Try</option>
            </select>
            
            <button id="submit-btn" class="bg-black text-white px-4 py-2 rounded font-bold w-full">Save Review</button>
            <p id="submit-msg" class="text-sm text-green-600 mt-2 hidden">Review saved!</p>
        </div>

        <div>
            <h2 class="text-lg font-semibold mb-4">Recent Reviews</h2>
            <div id="reviews-list" class="space-y-4">
                <p class="text-gray-500 text-sm">Loading reviews...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        // 🛑 YOUR KEYS ARE NOW LIVE HERE 🛑
        const supabaseUrl = 'https://eyhcwmccjkvcpfbkbpea.supabase.co'
        const supabaseKey = 'sb_publishable_bBAzEQACxjmRwd7IqCLEvQ_eLzlOGAM'
        const supabase = createClient(supabaseUrl, supabaseKey)

        let currentUser = null;
        let selectedPlace = null; 

        // UI Elements
        const authSection = document.getElementById('auth-section');
        const appSection = document.getElementById('app-section');
        const authMsg = document.getElementById('auth-msg');
        const reviewsList = document.getElementById('reviews-list');
        const searchInput = document.getElementById('restaurant-search');
        const searchResults = document.getElementById('search-results');

        // --- OPENSTREETMAP SEARCH LOGIC ---
        let timeout = null;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(timeout);
            const query = e.target.value;
            
            // Wait until they type at least 3 letters
            if(query.length < 3) {
                searchResults.classList.add('hidden');
                return;
            }
            
            // Wait 0.5 seconds after they stop typing before searching
            timeout = setTimeout(async () => {
                try {
                    // Appending "Bangalore" to force local results
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Bangalore')}&limit=5`);
                    const data = await res.json();
                    
                    searchResults.innerHTML = '';
                    if(data.length > 0) {
                        searchResults.classList.remove('hidden');
                        data.forEach(place => {
                            const li = document.createElement('li');
                            li.className = 'p-2 border-b hover:bg-gray-100 cursor-pointer text-sm text-gray-700';
                            
                            // Clean up the name for display
                            const shortName = place.name || place.display_name.split(',')[0];
                            li.innerHTML = `<strong>${shortName}</strong><br><span class="text-xs text-gray-500">${place.display_name}</span>`;
                            
                            // What happens when you click a result
                            li.onclick = () => {
                                searchInput.value = shortName;
                                selectedPlace = {
                                    name: shortName,
                                    address: place.display_name,
                                    // Generate a Google Maps link using the GPS coordinates
                                    url: `http://maps.google.com/maps?q=${place.lat},${place.lon}`
                                };
                                searchResults.classList.add('hidden');
                            };
                            searchResults.appendChild(li);
                        });
                    } else {
                        searchResults.innerHTML = '<li class="p-2 text-sm text-gray-500">No places found. Try another name.</li>';
                        searchResults.classList.remove('hidden');
                    }
                } catch (err) {
                    console.error("Search failed:", err);
                }
            }, 500); 
        });

        // Hide dropdown if you click somewhere else on the page
        document.addEventListener('click', (e) => {
            if (e.target !== searchInput && e.target !== searchResults) {
                searchResults.classList.add('hidden');
            }
        });

        // --- AUTH SETUP ---
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                currentUser = user;
                authSection.classList.add('hidden');
                appSection.classList.remove('hidden');
            }
            fetchReviews();
        }

        document.getElementById('login-btn').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) { authMsg.textContent = error.message; authMsg.classList.remove('hidden'); } 
            else { checkUser(); }
        });

        // --- SUBMIT REVIEW ---
        document.getElementById('submit-btn').addEventListener('click', async () => {
            const dishName = document.getElementById('dish-name').value;
            const rating = document.getElementById('rating').value;

            if(!selectedPlace) return alert("Please select a restaurant from the dropdown list!");
            if(!dishName) return alert("What did you order?");

            // Save restaurant to Supabase
            const { data: restData, error: restError } = await supabase
                .from('restaurants')
                .insert([{ 
                    name: selectedPlace.name,
                    address: selectedPlace.address,
                    google_maps_url: selectedPlace.url
                }])
                .select();

            if (restError) return alert(restError.message);

            // Save review to Supabase
            const { error: reviewError } = await supabase
                .from('reviews')
                .insert([{ 
                    restaurant_id: restData[0].id, 
                    user_id: currentUser.id, 
                    dish_name: dishName, 
                    rating: rating 
                }]);

            if (reviewError) return alert(reviewError.message);

            // Reset form
            searchInput.value = '';
            document.getElementById('dish-name').value = '';
            selectedPlace = null; 
            
            document.getElementById('submit-msg').classList.remove('hidden');
            setTimeout(() => document.getElementById('submit-msg').classList.add('hidden'), 3000);
            fetchReviews();
        });

        // --- FETCH REVIEWS ---
        async function fetchReviews() {
            const { data, error } = await supabase
                .from('reviews')
                .select(`
                    dish_name,
                    rating,
                    restaurants ( name, address, google_maps_url )
                `)
                .order('created_at', { ascending: false });

            if (error) { console.error(error); return; }

            reviewsList.innerHTML = '';
            if (data.length === 0) reviewsList.innerHTML = '<p class="text-gray-500 text-sm">No reviews yet.</p>';

            data.forEach(review => {
                const icon = review.rating === 'Like' ? '🔥' : review.rating === 'Dislike' ? '🚫' : '🤔';
                
                // Keep the clickable links!
                reviewsList.innerHTML += `
                    <div class="bg-gray-100 p-3 rounded shadow-sm">
                        <div class="flex justify-between items-start">
                            <a href="${review.restaurants.google_maps_url}" target="_blank" class="font-bold text-blue-600 hover:underline">
                                ${review.restaurants.name} ${icon}
                            </a>
                        </div>
                        <p class="text-xs text-gray-500 mb-1 truncate line-clamp-1">${review.restaurants.address}</p>
                        <p class="text-sm text-gray-800">Dish: <span class="font-medium">${review.dish_name}</span></p>
                    </div>
                `;
            });
        }

        checkUser();
    </script>
</body>
</html>
