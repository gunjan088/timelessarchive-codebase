<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Itinerary — Somewhere Good</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-950 min-h-screen text-white">

    <header id="main-nav" class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800/60"></header>

    <main class="max-w-2xl mx-auto px-4 py-10">
        <h1 class="text-2xl font-bold mb-8">🗺️ New Itinerary</h1>

        <!-- Header fields -->
        <div class="space-y-4 mb-8">
            <input id="itin-title" type="text" placeholder="Trip title (e.g. Goa Jan 2027)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 outline-none focus:border-orange-500">
            <input id="itin-destination" type="text" placeholder="Destination" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 outline-none focus:border-orange-500">
            <div class="flex gap-3">
                <div class="flex-1">
                    <label class="text-xs text-gray-500 mb-1 block">Start date</label>
                    <input id="itin-start" type="date" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white outline-none focus:border-orange-500">
                </div>
                <div class="flex-1">
                    <label class="text-xs text-gray-500 mb-1 block">End date</label>
                    <input id="itin-end" type="date" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white outline-none focus:border-orange-500">
                </div>
            </div>
            <div class="flex gap-3">
                <button id="status-planning" class="flex-1 py-2 rounded-xl text-sm font-semibold border border-orange-500 text-orange-400 bg-orange-500/10" data-status="planning">Planning</button>
                <button id="status-completed" class="flex-1 py-2 rounded-xl text-sm font-semibold border border-gray-700 text-gray-500" data-status="completed">Completed</button>
            </div>
        </div>

        <!-- Category tabs -->
        <div class="flex gap-1 border-b border-gray-800 mb-6">
            <button class="cat-tab active px-4 py-2 text-sm font-semibold text-orange-400 border-b-2 border-orange-400 -mb-px" data-cat="stay">Stay</button>
            <button class="cat-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-300" data-cat="eat">Eat</button>
            <button class="cat-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-300" data-cat="visit">Visit</button>
            <button class="cat-tab px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-300" data-cat="leisure">Leisure</button>
        </div>

        <!-- Per-category panel -->
        <div id="cat-panel" class="mb-6">
            <div class="flex items-center gap-3 mb-4">
                <div class="flex-1">
                    <label class="text-xs text-gray-500 mb-1 block">Budget for this category (₹)</label>
                    <input id="cat-budget" type="number" placeholder="Optional budget" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 outline-none focus:border-orange-500">
                </div>
            </div>

            <div id="places-list" class="space-y-2 mb-3"></div>
            <button id="add-place-btn" class="text-sm text-orange-400 hover:text-orange-300 transition-colors">+ Add place</button>
        </div>

        <!-- Budget summary -->
        <div id="budget-summary" class="bg-gray-900 rounded-2xl border border-gray-800 p-4 mb-8 space-y-2 text-sm hidden">
            <p class="font-semibold text-gray-300 mb-2">Budget Summary</p>
            <div id="budget-rows" class="space-y-1"></div>
            <div class="border-t border-gray-800 pt-2 mt-2 flex justify-between font-semibold">
                <span>Total</span>
                <span id="budget-total" class="text-orange-400"></span>
            </div>
        </div>

        <p id="write-msg" class="hidden text-red-400 text-sm mb-3"></p>
        <button id="publish-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold py-3 rounded-xl transition-all">
            Save Itinerary
        </button>
    </main>

    <script type="module" src="../js/itinerary-write.js"></script>
</body>
</html>
