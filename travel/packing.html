<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing Lists — Somewhere Good</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-950 min-h-screen text-white">

    <header id="main-nav" class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800/60"></header>

    <main class="max-w-2xl mx-auto px-4 py-10">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-3xl font-bold">🧳 Packing Lists</h1>
                <p class="text-gray-400 text-sm mt-1">Never forget the charger again</p>
            </div>
            <button id="new-list-btn" class="hidden bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-semibold px-4 py-2 rounded-xl text-sm transition-all transform hover:-translate-y-0.5 shadow-lg shadow-orange-500/20">
                + New List
            </button>
        </div>

        <!-- Sub-nav -->
        <div class="flex gap-1 mb-6 border-b border-gray-800">
            <a href="/travel/" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-300 transition-colors">Posts</a>
            <a href="/travel/itineraries.html" class="px-4 py-2 text-sm font-medium text-gray-500 hover:text-gray-300 transition-colors">Itineraries</a>
            <a href="/travel/packing.html" class="px-4 py-2 text-sm font-semibold text-orange-400 border-b-2 border-orange-400 -mb-px">Packing</a>
        </div>

        <!-- New list form (hidden by default) -->
        <div id="new-list-form" class="hidden bg-gray-900 rounded-2xl border border-gray-700 p-4 mb-6 space-y-3">
            <input id="new-list-name" type="text" placeholder="List name (e.g. Goa Trip, Default)" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
            <select id="new-list-itinerary" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white focus:outline-none focus:border-orange-500 transition-colors text-sm">
                <option value="">No trip linked (general list)</option>
            </select>
            <div class="flex gap-2">
                <button id="save-list-btn" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-semibold py-2 rounded-xl text-sm transition-colors">Create</button>
                <button id="cancel-list-btn" class="px-4 bg-gray-800 hover:bg-gray-700 text-gray-400 rounded-xl text-sm transition-colors">Cancel</button>
            </div>
        </div>

        <div id="lists-container" class="space-y-3"></div>

        <div id="empty-state" class="hidden text-center py-20">
            <div class="text-6xl mb-4">🧳</div>
            <p class="text-gray-400 text-lg font-medium">No packing lists yet</p>
            <p class="text-gray-600 text-sm mt-1">Create one to get started</p>
        </div>
    </main>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
        <div id="toast-inner" class="flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium"></div>
    </div>

    <script type="module" src="../js/packing.js"></script>
</body>
</html>
