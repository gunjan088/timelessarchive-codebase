<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books — Somewhere Good</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-gray-950 min-h-screen text-white">

    <header id="main-nav" class="sticky top-0 z-40 bg-gray-950/90 backdrop-blur-md border-b border-gray-800/60"></header>

    <!-- FILTER BAR -->
    <div class="sticky top-[57px] z-30 bg-gray-950/80 backdrop-blur-md border-b border-gray-800/40">
        <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center gap-2 overflow-x-auto scrollbar-hide">
            <button class="filter-chip active" data-filter="all">All</button>
            <button class="filter-chip" data-filter="Like">🔥 Loved</button>
            <button class="filter-chip" data-filter="One-Time Try">🤔 Once</button>
            <button class="filter-chip" data-filter="Dislike">🚫 Skip</button>
            <button class="filter-chip hidden" data-filter="wishlist" id="books-wishlist-chip">🔖 Wishlist</button>
            <div class="h-5 w-px bg-gray-700 mx-1 flex-shrink-0"></div>
            <select id="genre-filter" class="filter-select">
                <option value="">All Genres</option>
                <option value="Fiction">Fiction</option>
                <option value="Non-fiction">Non-fiction</option>
                <option value="Sci-Fi">Sci-Fi</option>
                <option value="Fantasy">Fantasy</option>
                <option value="Biography">Biography</option>
                <option value="History">History</option>
                <option value="Self-help">Self-help</option>
                <option value="Other">Other</option>
            </select>
            <div class="h-5 w-px bg-gray-700 mx-1 flex-shrink-0"></div>
            <input id="search-filter" type="text" placeholder="🔍 Search..." class="bg-gray-800/60 border border-gray-700/60 text-white text-xs rounded-full px-3 py-1.5 outline-none focus:border-orange-500 transition-colors w-28 flex-shrink-0 placeholder-gray-500">
        </div>
    </div>

    <main class="max-w-6xl mx-auto px-4 py-6">
        <div id="reviews-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        <div id="empty-state" class="hidden text-center py-20">
            <div class="text-6xl mb-4">📚</div>
            <p class="text-gray-400 text-lg font-medium">No reviews yet</p>
            <p class="text-gray-600 text-sm mt-1">Read something good!</p>
        </div>
    </main>

    <!-- ADD REVIEW MODAL -->
    <div id="modal-overlay" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/70 backdrop-blur-sm">
        <div id="modal-card" class="bg-gray-900 rounded-2xl border border-gray-700 w-full max-w-md shadow-2xl">
            <div class="flex items-center justify-between p-5 border-b border-gray-800">
                <h2 class="text-lg font-bold">New Review</h2>
                <button id="modal-close" class="text-gray-500 hover:text-white transition-colors text-2xl leading-none w-8 h-8 flex items-center justify-center rounded-lg hover:bg-gray-800">&times;</button>
            </div>
            <div class="p-5 space-y-4 max-h-[80vh] overflow-y-auto">
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Title</label>
                    <input id="book-title" type="text" placeholder="e.g. Sapiens, Atomic Habits..." class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Author <span class="text-gray-600 normal-case font-normal">(optional)</span></label>
                    <input id="book-author" type="text" placeholder="e.g. Yuval Noah Harari" class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Your Take <span class="text-gray-600 normal-case font-normal">(optional)</span></label>
                    <input id="book-note" type="text" placeholder="e.g. Changed how I think about..." class="w-full bg-gray-800 border border-gray-700 rounded-xl p-3 text-white placeholder-gray-500 focus:outline-none focus:border-orange-500 transition-colors text-sm">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Genre <span class="text-gray-600 normal-case font-normal">(optional)</span></label>
                    <div class="flex flex-wrap gap-2" id="genre-pills"></div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1.5 font-semibold uppercase tracking-wider">Rating</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button class="rating-btn" data-value="Like"><span class="text-2xl">🔥</span><span class="text-xs font-medium mt-1 text-gray-300">Loved it</span></button>
                        <button class="rating-btn" data-value="One-Time Try"><span class="text-2xl">🤔</span><span class="text-xs font-medium mt-1 text-gray-300">Once</span></button>
                        <button class="rating-btn" data-value="Dislike"><span class="text-2xl">🚫</span><span class="text-xs font-medium mt-1 text-gray-300">Skip it</span></button>
                    </div>
                </div>
                <button id="submit-btn" class="w-full bg-gradient-to-r from-orange-500 to-red-500 hover:from-orange-600 hover:to-red-600 text-white font-bold p-3 rounded-xl transition-all shadow-lg shadow-orange-500/20 text-sm">
                    Save Review
                </button>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden">
        <div id="toast-inner" class="flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium"></div>
    </div>

    <script type="module" src="../js/books.js"></script>
</body>
</html>
